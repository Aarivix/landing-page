<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aarivix — Reality, Measured.</title>
<style id="aarivix-tokens">
/* ============================================================
   AARIVIX — Reality, Measured.
   Foundations: color + type tokens
   Load order: import this once at the top of any document.
   Fonts are loaded from Google Fonts (faithful — these ARE the
   brand fonts). To go fully offline, drop tt/woff2 into /fonts
   and swap the @import for @font-face. See README.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  color-scheme: light;
  /* ---- Brand core palette ---------------------------------- */
  --paper:        #F3F2EA;  /* warm blueprint paper — primary light bg */
  --mint:         #AED0C9;  /* surveyor mint — secondary / accents      */
  --petrol:       #09324A;  /* deep petrol blue — ink, primary dark bg  */
  --signal:       #FFFB08;  /* signal yellow — measurement / highlight  */

  /* ---- Petrol ramp (cool navy) ----------------------------- */
  --petrol-900:   #04202F;
  --petrol-800:   #062A3D;
  --petrol-700:   #09324A;  /* = --petrol */
  --petrol-600:   #0E445F;
  --petrol-500:   #185C7C;
  --petrol-400:   #347E9F;
  --petrol-300:   #6BA6C0;
  --petrol-200:   #A8CCDC;
  --petrol-100:   #DCEAF1;

  /* ---- Mint ramp ------------------------------------------- */
  --mint-700:     #6FA097;
  --mint-600:     #88B4AC;
  --mint-500:     #AED0C9;  /* = --mint */
  --mint-400:     #C3DCD7;
  --mint-300:     #D8E8E4;
  --mint-200:     #E9F2F0;

  /* ---- Paper / neutral ramp (warm, paper-toned) ------------ */
  --paper-50:     #FBFAF5;
  --paper-100:    #F3F2EA;  /* = --paper */
  --paper-200:    #E6E4D6;
  --paper-300:    #D2CFBC;
  --neutral-400:  #ACA89A;
  --neutral-500:  #7E7B70;
  --neutral-600:  #555248;
  --ink:          #11261F;  /* near-black with a green cast */

  /* ---- Signal ramp (use sparingly) ------------------------- */
  --signal-500:   #FFFB08;  /* = --signal */
  --signal-600:   #E4DF00;
  --signal-tint:  #FBFBC9;

  /* ---- Semantic status ------------------------------------- */
  --ok:           #2F9E6B;
  --ok-tint:      #DCF0E6;
  --warn:         #E8A317;
  --warn-tint:    #FBEFD2;
  --error:        #D2502E;
  --error-tint:   #F7E0D8;
  --info:         #347E9F;

  /* ============================================================
     SEMANTIC TOKENS — light theme (default, "blueprint paper")
     ============================================================ */
  --bg:           var(--paper-100);
  --bg-raised:    var(--paper-50);
  --bg-sunken:    var(--paper-200);
  --surface:      #FFFFFF;
  --fg1:          var(--petrol-700);   /* primary text / ink */
  --fg2:          var(--neutral-600);  /* secondary text */
  --fg3:          var(--neutral-500);  /* tertiary / captions */
  --fg-invert:    var(--paper-50);
  --accent:       var(--petrol-700);
  --accent-fg:    var(--paper-50);
  --highlight:    var(--signal-500);   /* measurement marks, never large fills */
  --line:         var(--paper-300);    /* hairline borders */
  --line-strong:  var(--neutral-400);
  --grid-line:    rgba(9,50,74,0.07);  /* blueprint grid */
  --focus-ring:   var(--petrol-500);

  /* ---- Radii (tight, instrument-like) ---------------------- */
  --r-xs: 3px;
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 18px;
  --r-pill: 999px;

  /* ---- Spacing scale (4px base) ---------------------------- */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;

  /* ---- Elevation (low, crisp, cool-toned) ------------------ */
  --shadow-1: 0 1px 2px rgba(9,50,74,0.06), 0 1px 1px rgba(9,50,74,0.04);
  --shadow-2: 0 2px 8px rgba(9,50,74,0.08), 0 1px 2px rgba(9,50,74,0.06);
  --shadow-3: 0 8px 28px rgba(9,50,74,0.12), 0 2px 6px rgba(9,50,74,0.07);
  --shadow-inset: inset 0 0 0 1px rgba(9,50,74,0.06);

  /* ---- Type families --------------------------------------- */
  --font-display: 'Space Grotesk', system-ui, sans-serif;  /* headlines, UI labels */
  --font-body:    'Inter', system-ui, sans-serif;          /* body, paragraphs */
  --font-mono:    'IBM Plex Mono', ui-monospace, monospace;/* data, measurements, code */

  /* ---- Type scale (rem on 16px) ---------------------------- */
  --t-display:  4.5rem;   /* 72 */
  --t-h1:       3rem;     /* 48 */
  --t-h2:       2.25rem;  /* 36 */
  --t-h3:       1.5rem;   /* 24 */
  --t-h4:       1.25rem;  /* 20 */
  --t-body-lg:  1.125rem; /* 18 */
  --t-body:     1rem;     /* 16 */
  --t-sm:       0.875rem; /* 14 */
  --t-xs:       0.75rem;  /* 12 */
  --t-mono-sm:  0.8125rem;/* 13 */

  /* tracking */
  --track-tight: -0.02em;
  --track-label: 0.08em;   /* uppercase labels / eyebrows */
  --track-data:  0.02em;
}

/* ============================================================
   DARK THEME — "blueprint" (deep petrol). Add data-theme="dark"
   ============================================================ */
[data-theme="dark"] {
  color-scheme: dark;
  --bg:          var(--petrol-900);
  --bg-raised:   var(--petrol-800);
  --bg-sunken:   #021824;
  --surface:     var(--petrol-800);
  --fg1:         var(--paper-50);
  --fg2:         var(--petrol-200);
  --fg3:         var(--petrol-300);
  --fg-invert:   var(--petrol-900);
  --accent:      var(--signal-500);
  --accent-fg:   var(--petrol-900);
  --highlight:   var(--signal-500);
  --line:        rgba(174,208,201,0.16);
  --line-strong: rgba(174,208,201,0.32);
  --grid-line:   rgba(174,208,201,0.08);
  --focus-ring:  var(--signal-500);
  --shadow-1: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-2: 0 2px 10px rgba(0,0,0,0.45);
  --shadow-3: 0 10px 34px rgba(0,0,0,0.55);
}

/* ============================================================
   SEMANTIC TYPE CLASSES
   ============================================================ */
.t-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
  color: var(--fg3);
}
.t-display {
  font-family: var(--font-display);
  font-size: var(--t-display);
  font-weight: 600;
  line-height: 0.98;
  letter-spacing: var(--track-tight);
  color: var(--fg1);
}
h1, .t-h1 {
  font-family: var(--font-display);
  font-size: var(--t-h1);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: var(--track-tight);
  color: var(--fg1);
}
h2, .t-h2 {
  font-family: var(--font-display);
  font-size: var(--t-h2);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: var(--track-tight);
  color: var(--fg1);
}
h3, .t-h3 {
  font-family: var(--font-display);
  font-size: var(--t-h3);
  font-weight: 600;
  line-height: 1.2;
  color: var(--fg1);
}
h4, .t-h4 {
  font-family: var(--font-display);
  font-size: var(--t-h4);
  font-weight: 500;
  line-height: 1.3;
  color: var(--fg1);
}
.t-body-lg {
  font-family: var(--font-body);
  font-size: var(--t-body-lg);
  font-weight: 400;
  line-height: 1.6;
  color: var(--fg2);
}
p, .t-body {
  font-family: var(--font-body);
  font-size: var(--t-body);
  font-weight: 400;
  line-height: 1.6;
  color: var(--fg2);
}
.t-sm {
  font-family: var(--font-body);
  font-size: var(--t-sm);
  line-height: 1.5;
  color: var(--fg2);
}
.t-caption {
  font-family: var(--font-body);
  font-size: var(--t-xs);
  line-height: 1.4;
  color: var(--fg3);
}
.t-data, code, .t-mono {
  font-family: var(--font-mono);
  font-size: var(--t-mono-sm);
  letter-spacing: var(--track-data);
  font-feature-settings: "tnum" 1, "zero" 1;  /* tabular + slashed zero */
  color: var(--fg1);
}
.t-measure {
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: var(--track-data);
  font-feature-settings: "tnum" 1, "zero" 1;
}

</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg1); -webkit-font-smoothing: antialiased; }
  #scrollroot { transition: background .25s ease; }
  a { color: inherit; }
  .nav-link:hover, .nav-signin:hover { color: var(--fg1); }
  .foot-link:hover { color: var(--fg1); }
  ::selection { background: var(--signal-500); color: var(--petrol-900); }
  *:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .nav-burger { display: none !important; }

  /* ---- Tablet ---- */
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr !important; text-align: left; gap: 40px !important; }
    .hero-title { font-size: 46px !important; }
    .feature-row { grid-template-columns: 1fr !important; gap: 28px !important; }
    .feature-row .feature-copy { order: 1 !important; }
    .feature-row .feature-viz { order: 2 !important; }
    .how-grid { grid-template-columns: 1fr !important; }
    .faq-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
    .metric-band { grid-template-columns: repeat(2, 1fr) !important; }
    .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 32px !important; }
  }

  /* ---- Mobile ---- */
  @media (max-width: 700px) {
    .nav-links, .nav-signin, .nav-cta { display: none !important; }
    .nav-burger { display: flex !important; }
    .mobile-menu { display: block !important; }
    .hero-title { font-size: 38px !important; }
    .hero-sub { font-size: 17px !important; }
    .metric-band { grid-template-columns: repeat(2, 1fr) !important; }
    .footer-grid { grid-template-columns: 1fr !important; }
    .footer-base { flex-direction: column; gap: 8px; }
    .trust-strip-inner { justify-content: center; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/ui.jsx"></script>
<script type="text/babel" src="src/HeroFrame.jsx"></script>
<script type="text/babel" src="src/Sections.jsx"></script>
<script type="text/babel" src="src/Sections2.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "heroLayout": "split",
  "accent": "#09324A",
  "motion": true,
  "showTrust": true
}/*EDITMODE-END*/;

function Landing() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // resolve initial theme: tweak default, unless user toggled (stored)
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("aarivix-theme") || TWEAK_DEFAULTS.theme; }
    catch (e) { return TWEAK_DEFAULTS.theme; }
  });

  // keep tweak panel + nav toggle in sync
  useEffect(() => {
    if (t.theme && t.theme !== theme) setTheme(t.theme);
  }, [t.theme]);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    document.body.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
    try { localStorage.setItem("aarivix-theme", theme); } catch (e) {}
  }, [theme]);

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    setTweak("theme", next);
  };

  // custom accent (light mode primary) via tweak
  const accentStyle = (theme !== "dark" && t.accent && t.accent !== "#09324A")
    ? { "--accent": t.accent } : {};

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  return (
    <div id="scrollroot" style={accentStyle}>
      <Nav theme={theme} onToggleTheme={toggleTheme} />
      <Hero heroLayout={t.heroLayout} motion={t.motion} theme={theme} />
      {t.showTrust && <TrustStrip />}
      <HowItWorks motion={t.motion} />
      <Features />
      <FAQ />
      <CTABand />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={theme} options={["light", "dark"]}
          onChange={(v) => { setTheme(v); setTweak("theme", v); }} />
        <TweakColor label="Light accent" value={t.accent}
          options={["#09324A", "#0E445F", "#185C7C", "#11261F"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Hero" value={t.heroLayout} options={["split", "stacked"]}
          onChange={(v) => setTweak("heroLayout", v)} />
        <TweakToggle label="Trust strip" value={t.showTrust}
          onChange={(v) => setTweak("showTrust", v)} />
        <TweakSection label="Motion" />
        <TweakToggle label="Scan + count-up" value={t.motion}
          onChange={(v) => setTweak("motion", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Landing />);
</script>
</body>
</html>
